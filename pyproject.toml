[project]
name = "helm-notation-toolkit-py"
version = "0.1.0"
description = "Python migration of HELMNotationToolkit using RDKit"
requires-python = ">=3.10"
dependencies = [
  "rdkit",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
helm-notation = "helm_notation.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-dir]
"" = "python"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
]
